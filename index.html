@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body);color:var(--ink);background:var(--gray-50);line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-head);margin:0;letter-spacing:-.01em;}
table{border-collapse:collapse;width:100%;}
button{font-family:var(--font-body);cursor:pointer;transition:all .15s ease;}
input,select,textarea{font-family:var(--font-body);transition:border-color .15s ease;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--red-400);outline-offset:1px;}
.mono{font-family:var(--font-mono);}
.scroll::-webkit-scrollbar{height:8px;width:8px;}
.scroll::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px;}
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.btn{border:none;border-radius:8px;font-weight:600;padding:10px 16px;font-size:13.5px;}
.btn-primary{background:var(--red-600);color:#fff;}
.btn-primary:hover{background:var(--red-700);}
.btn-secondary{background:#fff;border:1px solid var(--gray-300);color:var(--ink);}
.btn-secondary:hover{background:var(--gray-100);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
tr[data-row]{cursor:pointer;transition:background .1s ease;}
tr[data-row]:hover{background:var(--gray-50);}
::placeholder{color:var(--slate-2);}
.spin{animation:gi-spin 0.8s linear infinite;}
@keyframes gi-spin{to{transform:rotate(360deg);}}
.skel{background:linear-gradient(90deg,var(--gray-100) 25%,var(--gray-150) 37%,var(--gray-100) 63%);background-size:400% 100%;animation:gi-shimmer 1.4s ease infinite;border-radius:6px;}
@keyframes gi-shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
.pagebtn{min-width:32px;height:32px;padding:0 8px;border-radius:7px;border:1px solid var(--gray-300);background:#fff;font-size:12.5px;font-weight:600;color:var(--slate);}
.pagebtn:hover:not(:disabled){background:var(--gray-100);}
.pagebtn.active{background:var(--red-600);border-color:var(--red-600);color:#fff;}
.gi-table{table-layout:fixed;border-collapse:separate;border-spacing:0;width:auto;}
.gi-table thead th{border-bottom:1px solid var(--gray-200);}
.gi-table th,.gi-table td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gi-table tbody tr:nth-child(even){background:var(--gray-50);}
.gi-table tbody tr:hover{background:var(--red-50) !important;}
.col-resizer{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;z-index:6;}
.col-resizer:hover,.col-resizer.active{background:rgba(219,0,0,.25);}
.nav-item{position:relative;text-align:left;padding:10px 12px 10px 16px;border:none;border-radius:8px;font-size:13.5px;background:transparent;color:var(--slate);transition:background .16s ease,color .16s ease,padding-left .16s ease;}
.nav-item::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:0;background:var(--red-600);border-radius:0 3px 3px 0;transition:height .16s ease;}
.nav-item:hover{background:var(--gray-100);color:var(--ink);padding-left:20px;}
.nav-item:hover::before{height:60%;}
.nav-item.active{background:var(--red-600);color:#fff;font-weight:600;}
.nav-item.active::before{height:0;}
.nav-item.active:hover{background:var(--red-700);padding-left:16px;}
.auth-panel{flex:1 1 50%;min-width:0;}
@media (max-width:760px){.auth-panel{flex-basis:100%;}}
@media (max-width:820px){
  #gi-sidebar{position:fixed;left:-240px;top:0;bottom:0;z-index:60;transition:left .2s ease;}

  #gi-hamburger{display:flex !important;}
  #gi-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;}
  #gi-overlay.show{display:block;}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

function nextId(list, prefix){
  var max=0;
  list.forEach(function(x){ var m=(x.id||'').match(new RegExp('^'+prefix+'(\\\\d+)$')); if(m) max=Math.max(max, parseInt(m[1],10)); });

function showResendLink(email){
  var old = document.getElementById('gi-resend-box'); if(old) old.remove();

  if(loginBtn && loginBtn.parentNode) loginBtn.parentNode.insertBefore(box, loginBtn.nextSibling);

    toast('Confirmation email sent. Please check your inbox.');
    box.remove();
  };
}

    '<label style="display:block;font-size:12px;font-weight:600;color:var(--slate);margin-bottom:5px;">'+label+(required?' <span style="color:var(--red-500);">*</span>':'')+'</label>'+
    '<div style="position:relative;">'+

      '<button type="button" data-toggle-pass="'+id+'" title="Show/hide password" style="position:absolute;right:5px;top:50%;transform:translateY(-50%);background:none;border:none;padding:5px;cursor:pointer;color:var(--slate-2);display:flex;align-items:center;">'+eyeIcon(false)+'</button>'+

function eyeIcon(open){
  return open?
    '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.9 18.9 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.9 18.9 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    :
    '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
}
function bindPasswordToggles(container){
  (container||root).querySelectorAll('[data-toggle-pass]').forEach(function(btn){
    btn.onclick=function(){
      var input = document.getElementById(btn.getAttribute('data-toggle-pass'));
      if(!input) return;
      var showing = input.type==='text';
      input.type = showing? 'password':'text';
      btn.innerHTML = eyeIcon(!showing);
    };
  });
}

function bindAuth(){
  root.querySelectorAll('[data-authmode]').forEach(function(b){ b.onclick=function(){ state.authMode=b.getAttribute('data-authmode'); render(); }; });
  bindPasswordToggles();

  var btnLogin = root.querySelector('#btn-login');
  if(btnLogin) btnLogin.onclick=async function(){
    var email=(root.querySelector('#li-email').value||'').trim().toLowerCase();
    var pass=root.querySelector('#li-pass').value||'';
    if(!email||!pass){ toast('Please enter both email and password.','error'); return; }
    btnLogin.textContent='Signing in...'; btnLogin.disabled=true;
    var {data,error} = await sb.auth.signInWithPassword({email:email,password:pass});
    btnLogin.textContent='Sign in'; btnLogin.disabled=false;
    if(error){
      if(/confirm/i.test(error.message)){
        toast('Please verify your email before signing in. Check your inbox for the confirmation link.','error');
        showResendLink(email);
      } else {
        toast('Incorrect email or password.','error');
      }
      return;
    }
    var {data:aal} = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(aal && aal.nextLevel==='aal2' && aal.nextLevel!==aal.currentLevel){
      state.pendingLoginEmail = email;
      state.authMode='mfa';
      render();
      return;
    }
    await sb.from('login_history').insert({user_id:data.user.id, email:email});
    await afterAuth();
  };
  var btnMfaVerify = root.querySelector('#btn-mfa-verify');
  if(btnMfaVerify) btnMfaVerify.onclick=async function(){
    var code=(root.querySelector('#mfa-code').value||'').trim();
    if(!code){ toast('Enter the 6-digit code.','error'); return; }
    btnMfaVerify.textContent='Verifying...'; btnMfaVerify.disabled=true;
    var {data:factors} = await sb.auth.mfa.listFactors();
    var totp = factors && factors.totp && factors.totp[0];
    if(!totp){ toast('No authenticator found on this account.','error'); btnMfaVerify.textContent='Verify'; btnMfaVerify.disabled=false; return; }
    var {data:challenge, error:chErr} = await sb.auth.mfa.challenge({factorId:totp.id});
    if(chErr){ toast(chErr.message,'error'); btnMfaVerify.textContent='Verify'; btnMfaVerify.disabled=false; return; }
    var {data:verified, error:verErr} = await sb.auth.mfa.verify({factorId:totp.id, challengeId:challenge.id, code:code});
    btnMfaVerify.textContent='Verify'; btnMfaVerify.disabled=false;
    if(verErr){ toast('Invalid or expired code.','error'); return; }
    var {data:{session}} = await sb.auth.getSession();
    if(session) await sb.from('login_history').insert({user_id:session.user.id, email:state.pendingLoginEmail||session.user.email});
    state.authMode='login';
    await afterAuth();
  };
  var btnMfaCancel = root.querySelector('#btn-mfa-cancel');
  if(btnMfaCancel) btnMfaCancel.onclick=async function(){ await sb.auth.signOut(); state.authMode='login'; render(); };
  var btnForgot = root.querySelector('#btn-forgot');
  if(btnForgot) btnForgot.onclick=function(){ state.authMode='forgot'; render(); };
  var btnBackLogin = root.querySelector('#btn-back-login');
  if(btnBackLogin) btnBackLogin.onclick=function(){ state.authMode='login'; render(); };
  var btnSendReset = root.querySelector('#btn-send-reset');
  if(btnSendReset) btnSendReset.onclick=async function(){
    var email=(root.querySelector('#fg-email').value||'').trim().toLowerCase();
    if(!email){ toast('Please enter your email.','error'); return; }
    btnSendReset.textContent='Sending...'; btnSendReset.disabled=true;
    await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    btnSendReset.textContent='Send reset link'; btnSendReset.disabled=false;
    toast('If that email exists, a password reset link has been sent. Check your inbox.');
    state.authMode='login'; render();
  };
  var btnSetNewPass = root.querySelector('#btn-set-newpass');
  if(btnSetNewPass) btnSetNewPass.onclick=async function(){
    var p1 = root.querySelector('#rc-pass').value||'';
    var p2 = root.querySelector('#rc-pass2').value||'';
    if(p1.length<8){ toast('Password must be at least 8 characters.','error'); return; }
    if(p1!==p2){ toast('Passwords do not match.','error'); return; }
    btnSetNewPass.textContent='Saving...'; btnSetNewPass.disabled=true;
    var {error} = await sb.auth.updateUser({ password: p1 });
    btnSetNewPass.textContent='Set new password'; btnSetNewPass.disabled=false;
    if(error){ toast(error.message,'error'); return; }
    var {data:aal} = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(aal && aal.nextLevel==='aal2' && aal.nextLevel!==aal.currentLevel){
      toast('Password updated. Please verify your 2FA code to continue.');
      state.authMode='mfa';
      render();
      return;
    }
    toast('Password updated. You are now signed in.');
    state.authMode='login';
    await afterAuth();
  };
  var btnReg = root.querySelector('#btn-register');
  if(btnReg) btnReg.onclick=async function(){
    var name=(root.querySelector('#re-name').value||'').trim();
    var company=(root.querySelector('#re-company').value||'').trim();
    var title=(root.querySelector('#re-title').value||'').trim();
    var cc=root.querySelector('#re-cc').value;
    var phone=(root.querySelector('#re-phone').value||'').trim();
    var email=(root.querySelector('#re-email').value||'').trim().toLowerCase();
    var pass=root.querySelector('#re-pass').value||'';
    var pass2=root.querySelector('#re-pass2').value||'';
    if(!name||!phone||!email||!pass){ toast('Please fill in all required fields.','error'); return; }
    if(pass.length<8){ toast('Password must be at least 8 characters.','error'); return; }
    if(pass!==pass2){ toast('Passwords do not match.','error'); return; }
    btnReg.textContent='Creating...'; btnReg.disabled=true;
    var {data,error} = await sb.auth.signUp({ email:email, password:pass, options:{ data:{ full_name:name, company:company, title:title, phone_cc:cc, phone:phone } } });
    btnReg.textContent='Create account'; btnReg.disabled=false;
    if(error){ toast(error.message,'error'); return; }
    if(data.session){
      await sb.from('login_history').insert({user_id:data.user.id, email:email});
      toast('Account created successfully!');
      await afterAuth();
    } else {
      toast('Sign up successful! Check your email to confirm your account, then sign in.');
      state.authMode='login'; render();
    }
  };
}

async function fetchPipeline(force){

}

async function fetchProfiles(force){

  var {data,error} = await sb.from('profiles').select('*').order('created_at');
  if(error){ toast('Failed to load users: '+error.message,'error'); return []; }

async function fetchMyHistory(force){
  if(state.cache.myHistory && !force) return state.cache.myHistory;
  var {data} = await sb.from('login_history').select('*').eq('user_id', state.profile.id).order('created_at',{ascending:false});
  state.cache.myHistory = data||[]; return state.cache.myHistory;
}
async function fetchUserHistory(userId){
  var {data} = await sb.from('login_history').select('*').eq('user_id', userId).order('created_at',{ascending:false});
  return data||[];
}
async function fetchAuditTrail(force){
  if(state.cache.audit && !force) return state.cache.audit;
  var loginRes = await sb.from('login_history').select('*').order('created_at',{ascending:false}).limit(500);
  var actRes = await sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(500);
  var logins = (loginRes.data||[]).map(function(h){ return {user_id:h.user_id, email:h.email, action:'Signed in', details:'', created_at:h.created_at}; });
  var acts = actRes.data||[];
  if(loginRes.error && actRes.error){ toast('Failed to load audit trail.','error'); return []; }
  var combined = logins.concat(acts);
  combined.sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); });
  state.cache.audit = combined;
  return state.cache.audit;
}
async function logActivity(action, details){
  try{
    if(!state.session) return;
    await sb.from('activity_log').insert({ user_id: state.session.user.id, email: state.profile? state.profile.email : state.session.user.email, action: action, details: details||'' });
    state.cache.audit = null;
  }catch(e){ /* non-critical, ignore */ }
}
async function fetchAssignedUserIds(dealId){
  var {data} = await sb.from('deal_assignments').select('user_id').eq('deal_id', dealId);
  return (data||[]).map(function(r){return r.user_id;});
}
async function fetchMyAccessRequest(force){
  if(state.cache.myAccessReq!==undefined && !force) return state.cache.myAccessReq;
  var {data} = await sb.from('access_requests').select('*').eq('user_id', state.profile.id).order('created_at',{ascending:false}).limit(1);
  state.cache.myAccessReq = (data&&data[0]) || null;
  return state.cache.myAccessReq;
}
async function fetchAllAccessRequests(force){
  if(state.cache.accessRequests && !force) return state.cache.accessRequests;
  var {data,error} = await sb.from('access_requests').select('*').order('created_at',{ascending:false});
  if(error){ toast('Failed to load access requests: '+error.message,'error'); return []; }
  state.cache.accessRequests = data||[];
  return state.cache.accessRequests;
}
async function submitAccessRequest(message){
  var {error} = await sb.from('access_requests').insert({ user_id: state.profile.id, email: state.profile.email, full_name: state.profile.full_name, message: message||'' });
  if(error){ toast(error.message,'error'); return; }
  state.cache.myAccessReq = undefined;
  logActivity('Requested Pipeline access', message||'');
  toast('Access request sent to Admin.');
}
async function resolveAccessRequest(id, status){
  var {error} = await sb.from('access_requests').update({ status:status, resolved_at:new Date().toISOString(), resolved_by: state.session.user.id }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  state.cache.accessRequests = null;
  logActivity(status==='approved'?'Approved access request':'Denied access request', 'Request #'+id);
  toast('Request '+status+'.');
}

/* ---------------- PAGINATION HELPERS ---------------- */
function paginate(list, page){
  var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  page = Math.min(Math.max(1, page), totalPages);
  var start = (page-1)*PAGE_SIZE;
  return { items: list.slice(start, start+PAGE_SIZE), page: page, totalPages: totalPages, total: list.length, start: list.length? start+1:0, end: Math.min(start+PAGE_SIZE, list.length) };
}
function paginationBar(info, key){
  if(info.total===0) return '';
  var pages = [];
  var p = info.page, tp = info.totalPages;
  var range = [];
  for(var i=1;i<=tp;i++){ if(i===1||i===tp||Math.abs(i-p)<=1) range.push(i); else if(range[range.length-1]!=='...') range.push('...'); }
  range.forEach(function(n){
    if(n==='...') pages.push('<span style="padding:0 4px;color:var(--slate-2);font-size:12.5px;">&hellip;</span>');
    else pages.push('<button class="pagebtn'+(n===p?' active':'')+'" data-page="'+key+':'+n+'">'+n+'</button>');
  });
  return '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:4px 4px 0;">'+
    '<div style="font-size:12.5px;color:var(--slate);">Showing '+info.start+'&ndash;'+info.end+' of '+info.total+'</div>'+
    '<div style="display:flex;gap:4px;align-items:center;">'+
      '<button class="pagebtn" data-page="'+key+':'+(p-1)+'" '+(p<=1?'disabled':'')+'>&larr;</button>'+
      pages.join('')+
      '<button class="pagebtn" data-page="'+key+':'+(p+1)+'" '+(p>=tp?'disabled':'')+'>&rarr;</button>'+
    '</div>'+
  '</div>';
}
function bindPagination(onChange){
  root.querySelectorAll('[data-page]').forEach(function(b){
    if(b.disabled) return;
    b.onclick=function(){
      var parts = b.getAttribute('data-page').split(':');
      onChange(parts[0], parseInt(parts[1],10));
    };
  });
}

function colgroupHtml(widths){

function makeResizableTable(tableId, key){
  var table = root.querySelector('#'+tableId);
  if(!table) return;
  var widths = getColWidths(key);
  var ths = table.querySelectorAll('thead th');
  ths.forEach(function(th, idx){
    if(idx>=ths.length-1) return;
    var inner = th.querySelector('.th-inner') || th;
    var handle = document.createElement('div');
    handle.className='col-resizer';
    inner.appendChild(handle);
    handle.addEventListener('mousedown', function(e){
      e.preventDefault(); e.stopPropagation();
      handle.classList.add('active');
      var startX = e.clientX;
      var col = table.querySelectorAll('colgroup col')[idx];
      var startWidth = parseInt(col.style.width,10) || 100;
      function onMove(ev){
        var newW = Math.max(48, startWidth + (ev.clientX-startX));
        col.style.width = newW+'px';
        widths[idx] = newW;
        table.style.width = widths.reduce(function(a,b){return a+b;},0)+'px';
      }
      function onUp(){ handle.classList.remove('active'); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

function statusPill(s){
  var map = { 'Closed':['#DCFCE7','#15803D'], 'In Progress':['#FEF3C7','#B45309'], 'On Hold':['#F1F5F9','#475569'], 'Open':['#DBEAFE','#1D4ED8'] };
  var c = map[s] || ['var(--gray-150)','var(--slate)'];
  return '<span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:'+c[0]+';color:'+c[1]+';white-space:nowrap;">'+esc(s)+'</span>';
}
function typePill(s){
  var map = { 'PE':['#EDE9FE','#6D28D9'], 'VC':['#CFFAFE','#0E7490'], 'IF':['#FFEDD5','#C2410C'], 'FM':['#FCE7F3','#BE185D'], 'BF':['#E0E7FF','#4338CA'], 'FG':['#FEF3C7','#B45309'] };
  var c = map[s] || ['var(--gray-150)','var(--slate)'];
  return '<span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:'+c[0]+';color:'+c[1]+';white-space:nowrap;">'+esc(s||'—')+'</span>';
}
function actionPill(s){
  var c = ['#F1F5F9','#475569'];
  if(s==='Signed in') c = ['#DBEAFE','#1D4ED8'];
  else if(/Created/.test(s)) c = ['#DCFCE7','#15803D'];
  else if(/Edited|Updated|Changed/.test(s)) c = ['#FEF3C7','#B45309'];
  else if(/Deleted/.test(s)) c = ['#FEE2E2','#B91C1C'];
  return '<span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:'+c[0]+';color:'+c[1]+';white-space:nowrap;">'+esc(s)+'</span>';
}

async function renderAccessRequests(){
  setBody('<div class="skel" style="height:28px;width:200px;margin-bottom:18px;"></div>'+loadingBlock(6));
  var reqs = await fetchAllAccessRequests();
  var profiles = await fetchProfiles();
  var profileMap = {}; profiles.forEach(function(p){ profileMap[p.id]=p; });
  var pending = reqs.filter(function(r){return r.status==='pending';});
  var resolved = reqs.filter(function(r){return r.status!=='pending';});

  function statusChip(status){
    var pillMap = { pending:['#FEF3C7','#B45309'], approved:['#DCFCE7','#15803D'], denied:['#FEE2E2','#B91C1C'] };
    var c = pillMap[status];
    return '<span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:'+c[0]+';color:'+c[1]+';white-space:nowrap;">'+status.charAt(0).toUpperCase()+status.slice(1)+'</span>';
  }
  function tableBlock(list, title){
    if(!list.length) return '';
    return '<h3 style="font-size:13px;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;margin:20px 0 10px;">'+title+' ('+list.length+')</h3>'+
    '<div class="card scroll" style="overflow:auto;">'+
      '<table style="min-width:1100px;width:100%;border-collapse:separate;border-spacing:0;">'+
        '<thead><tr>'+
          ['Full Name','Email','Company','Title','Phone','Message','Requested','Status',''].map(function(h){return '<th style="text-align:left;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate);font-weight:600;background:var(--gray-100);border-bottom:1px solid var(--gray-200);white-space:nowrap;">'+h+'</th>';}).join('')+
        '</tr></thead><tbody>'+
        list.map(function(r,idx){
          var p = profileMap[r.user_id];
          return '<tr style="border-top:1px solid var(--gray-150);background:'+(idx%2===1?'var(--gray-50)':'#fff')+';">'+
            '<td style="padding:8px 12px;font-size:13px;font-weight:500;white-space:nowrap;">'+esc(r.full_name)+'</td>'+
            '<td style="padding:8px 12px;font-size:12.5px;color:var(--slate);white-space:nowrap;">'+esc(r.email)+'</td>'+
            '<td style="padding:8px 12px;font-size:12.5px;white-space:nowrap;">'+(esc(p?p.company:'')||'—')+'</td>'+
            '<td style="padding:8px 12px;font-size:12.5px;white-space:nowrap;">'+(esc(p?p.title:'')||'—')+'</td>'+
            '<td style="padding:8px 12px;font-size:12.5px;white-space:nowrap;">'+(p?esc(p.phone_cc)+' '+esc(p.phone):'—')+'</td>'+
            '<td style="padding:8px 12px;font-size:12.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+esc(r.message)+'">'+(esc(r.message)||'—')+'</td>'+
            '<td style="padding:8px 12px;font-size:12.5px;white-space:nowrap;">'+fmtDate(r.created_at)+'</td>'+
            '<td style="padding:8px 12px;">'+statusChip(r.status)+'</td>'+
            '<td style="padding:8px 12px;white-space:nowrap;">'+(r.status==='pending'? '<div style="display:flex;gap:6px;"><button class="btn btn-sm btn-secondary" data-deny="'+r.id+'" style="color:var(--red-600);">Deny</button><button class="btn btn-sm btn-primary" data-approve="'+r.id+'">Approve</button></div>' : '<span style="font-size:11.5px;color:var(--slate-2);">'+(r.resolved_at?fmtDate(r.resolved_at):'—')+'</span>')+'</td>'+
          '</tr>';
        }).join('')+
        '</tbody></table>'+
    '</div>';
  }

  var html = '<div style="margin-bottom:14px;"><h1 style="font-size:23px;">Access Requests</h1><p style="color:var(--slate);font-size:13.5px;margin-top:3px;">Visitors requesting access to the Pipeline, with full profile details for review.</p></div>'+
  (pending.length? tableBlock(pending,'Pending') : '<p style="font-size:13px;color:var(--slate-2);margin-bottom:10px;">No pending requests.</p>')+
  tableBlock(resolved,'Resolved');
  setBody(html);

  root.querySelectorAll('[data-approve]').forEach(function(b){
    b.onclick=async function(){ b.disabled=true; b.textContent='Approving...'; await resolveAccessRequest(parseInt(b.getAttribute('data-approve'),10),'approved'); renderAccessRequests(); };
  });
  root.querySelectorAll('[data-deny]').forEach(function(b){
    b.onclick=async function(){ b.disabled=true; b.textContent='Denying...'; await resolveAccessRequest(parseInt(b.getAttribute('data-deny'),10),'denied'); renderAccessRequests(); };
  });
}

      return !q || (c.full_name+' '+c.email).toLowerCase().indexOf(q)>-1;

    listHost.innerHTML = filtered.length? '<div style="display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto;">'+
      filtered.map(function(c){
        return '<label style="display:flex;align-items:center;gap:9px;font-size:13px;padding:7px 9px;border:1px solid var(--gray-150);border-radius:8px;">'+
          '<input type="checkbox" data-cand="'+c.id+'" '+(selected[c.id]?'checked':'')+' /> <span style="font-weight:500;">'+esc(c.full_name)+'</span><span style="color:var(--slate-2);font-size:11.5px;">'+esc(c.email)+'</span>'+

      chk.onchange = function(){ selected[chk.getAttribute('data-cand')] = chk.checked; };

  }
  renderList();
  document.getElementById('assign-q').oninput = renderList;

  var saveBtn = document.getElementById('btn-assign-save');
  if(saveBtn) saveBtn.onclick = async function(){
    var checked = Object.keys(selected).filter(function(id){ return selected[id]; });
    saveBtn.textContent='Saving...'; saveBtn.disabled=true;
    await sb.from('deal_assignments').delete().eq('deal_id', deal.id);
    if(checked.length){
      await sb.from('deal_assignments').insert(checked.map(function(uid){return {deal_id:deal.id, user_id:uid};}));
    }
    closeModal();
    logActivity('Updated assignment', deal.id+' ('+esc(deal.name)+') -> '+checked.length+' user(s)');
    toast('Visibility updated for '+deal.id+'.');
  };
}

async function startMfaEnroll(){
  var {data,error} = await sb.auth.mfa.enroll({factorType:'totp'});
  if(error){ toast(error.message,'error'); return; }
  openModal('<div style="position:fixed;inset:0;background:rgba(20,18,16,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;" id="gi-modal-bg">'+
    '<div class="card scroll" style="max-width:400px;width:100%;max-height:88vh;overflow:auto;padding:26px 28px;text-align:center;">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;text-align:left;">'+
        '<h2 style="font-size:18px;">Set up 2FA</h2>'+
        '<button id="gi-modal-close" style="border:none;background:var(--gray-100);width:28px;height:28px;border-radius:50%;font-size:15px;">&times;</button>'+
      '</div>'+
      '<p style="font-size:12.5px;color:var(--slate);text-align:left;margin:8px 0 16px;line-height:1.55;">Scan this QR code with an authenticator app (Google Authenticator, Authy, 1Password...), then enter the 6-digit code it generates.</p>'+
      '<div style="background:#fff;border:1px solid var(--gray-200);border-radius:10px;padding:14px;display:flex;justify-content:center;">'+data.totp.qr_code+'</div>'+
      '<p style="font-size:11px;color:var(--slate-2);margin:10px 0 16px;word-break:break-all;">Can\'t scan? Enter this key manually: <span class="mono" style="color:var(--ink);">'+data.totp.secret+'</span></p>'+
      '<div style="text-align:left;">'+inputField('Verification code','mfa-enroll-code','text','123456',true)+'</div>'+
      '<button id="btn-mfa-confirm" class="btn btn-primary" style="width:100%;margin-top:4px;">Confirm and enable</button>'+
    '</div></div>');
  bindModalClose();
  var btn = document.getElementById('btn-mfa-confirm');
  btn.onclick = async function(){
    var code = (document.getElementById('mfa-enroll-code').value||'').trim();
    if(!code){ toast('Enter the 6-digit code.','error'); return; }
    btn.textContent='Verifying...'; btn.disabled=true;
    var {data:challenge, error:chErr} = await sb.auth.mfa.challenge({factorId:data.id});
    if(chErr){ toast(chErr.message,'error'); btn.textContent='Confirm and enable'; btn.disabled=false; return; }
    var {error:verErr} = await sb.auth.mfa.verify({factorId:data.id, challengeId:challenge.id, code:code});
    if(verErr){ toast('Invalid code, please try again.','error'); btn.textContent='Confirm and enable'; btn.disabled=false; return; }
    logActivity('Enabled 2FA','Self');
    toast('Two-factor authentication enabled.');
    closeModal();
    renderProfile();
  };
}

      '<div style="display:flex;justify-content:space-between;align-items:flex-start;">'+
        '<h2 style="font-size:18px;">Edit Investor <span class="mono" style="color:var(--red-600);font-size:14px;">'+d.id+'</span></h2>'+
        '<button id="gi-modal-close" style="border:none;background:var(--gray-100);width:28px;height:28px;border-radius:50%;font-size:15px;">&times;</button>'+
      '</div>'+
      textField('ID','ei-id',d.id,true,true)+
      textField('Investor Type','ei-type',d.investor_type,true)+
      textField('Jurisdiction','ei-juris',d.jurisdiction,true)+
      selectFieldHtml('Type','ei-ptype',['PE','VC','IF','FM','BF','FG'],true,d.ptype)+
      textField('Target Market','ei-target',d.target_country,false)+
      textareaFieldHtml('Sector of Interest','ei-sector',false,d.sector)+
      textareaFieldHtml('Strategy','ei-strategy',false,d.strategy)+
      textField('Min Deal Size','ei-mindeal',d.min_deal,false)+
      textField('Min EBITDA','ei-minebitda',d.min_ebitda,false)+
      textField('Min Revenue','ei-minrev',d.min_rev,false)+
      textareaFieldHtml('Remarks','ei-remarks',false,d.remarks)+
      '<div style="display:flex;gap:8px;margin-top:6px;">'+
        '<button id="btn-delete-investor" class="btn btn-secondary" style="flex:1;color:var(--red-600);">Delete</button>'+
        '<button id="btn-update-investor" class="btn btn-primary" style="flex:2;">Save Changes</button>'+
      '</div>'+
    '</div></div>');
  bindModalClose();
  var btn = document.getElementById('btn-update-investor');
  btn.onclick = async function(){
    var payload = {
      investor_type: document.getElementById('ei-type').value.trim(),
      jurisdiction: document.getElementById('ei-juris').value.trim(),
      ptype: document.getElementById('ei-ptype').value,
      target_country: document.getElementById('ei-target').value.trim(),
      sector: document.getElementById('ei-sector').value.trim(),
      strategy: document.getElementById('ei-strategy').value.trim(),
      min_deal: document.getElementById('ei-mindeal').value.trim(),
      min_ebitda: document.getElementById('ei-minebitda').value.trim(),
      min_rev: document.getElementById('ei-minrev').value.trim(),
      remarks: document.getElementById('ei-remarks').value.trim()
    };
    if(!payload.investor_type||!payload.jurisdiction){ toast('Please fill in all required fields.','error'); return; }
    btn.textContent='Saving...'; btn.disabled=true;
    var {error} = await sb.from('investor_needs').update(payload).eq('id', d.id);
    btn.textContent='Save Changes'; btn.disabled=false;
    if(error){ toast(error.message,'error'); return; }
    state.cache.investors=null;
    closeModal();
    logActivity('Edited investor', d.id+' - '+payload.investor_type);
    toast('Investor '+d.id+' updated.');
    renderInvestors();
  };
  var delBtn = document.getElementById('btn-delete-investor');
  delBtn.onclick = async function(){
    if(!confirm('Delete investor '+d.id+'? This cannot be undone.')) return;
    delBtn.textContent='Deleting...'; delBtn.disabled=true;
    var {error} = await sb.from('investor_needs').delete().eq('id', d.id);
    if(error){ toast(error.message,'error'); delBtn.textContent='Delete'; delBtn.disabled=false; return; }
    state.cache.investors=null;
    closeModal();
    logActivity('Deleted investor', d.id+' - '+esc(d.investor_type));
    toast('Investor '+d.id+' deleted.');
    renderInvestors();
  };
}

/* ---------------- EVENT BINDINGS ---------------- */
function bindPipelineEvents(){
  var pq=root.querySelector('#pipe-q'); if(pq) pq.oninput=function(){ state.pipeQ=pq.value; state.pipePage=1; renderPipeline(); };
  var ps=root.querySelector('#pipe-sector'); if(ps) ps.onchange=function(){ state.pipeSector=ps.value; state.pipePage=1; renderPipeline(); };
  var pst=root.querySelector('#pipe-status'); if(pst) pst.onchange=function(){ state.pipeStatus=pst.value; state.pipePage=1; renderPipeline(); };
  var badd=root.querySelector('#btn-add-deal'); if(badd) badd.onclick=function(){ addDealModal(); };
  var breq=root.querySelector('#btn-request-access'); if(breq) breq.onclick=function(){ requestAccessModal(); };
  root.querySelectorAll('tr[data-deal]').forEach(function(tr){
    tr.onclick=function(e){ if(e.target.closest('[data-assign]')) return; var d=state.cache.pipeline.find(function(x){return x.id===tr.getAttribute('data-deal');}); dealModal(d); };
  });
  root.querySelectorAll('[data-assign]').forEach(function(b){
    b.onclick=function(e){ e.stopPropagation(); var d=state.cache.pipeline.find(function(x){return x.id===b.getAttribute('data-assign');}); assignModal(d); };
  });
  bindPagination(function(key,page){ state.pipePage=page; renderPipeline(); });
  makeResizableTable('pipe-table','pipe');
}
function bindInvestorEvents(){
  var iq=root.querySelector('#inv-q'); if(iq) iq.oninput=function(){ state.invQ=iq.value; state.invPage=1; renderInvestors(); };
  var it=root.querySelector('#inv-type'); if(it) it.onchange=function(){ state.invType=it.value; state.invPage=1; renderInvestors(); };
  var badd=root.querySelector('#btn-add-investor'); if(badd) badd.onclick=function(){ addInvestorModal(); };
  root.querySelectorAll('tr[data-inv]').forEach(function(tr){
    tr.onclick=function(){ var d=state.cache.investors.find(function(x){return x.id===tr.getAttribute('data-inv');}); investorModal(d); };
  });
  bindPagination(function(key,page){ state.invPage=page; renderInvestors(); });
  makeResizableTable('inv-table','inv');
}
function bindAdminUsersEvents(){
  root.querySelectorAll('[data-role]').forEach(function(sel){
    sel.onchange=async function(){
      var id = sel.getAttribute('data-role');
      var targetUser = state.cache.profiles.find(function(x){return x.id===id;});
      var payload = {role: sel.value};
      var {error} = await sb.from('profiles').update(payload).eq('id', id);
      if(error){ toast(error.message,'error'); return; }
      logActivity('Changed role', (targetUser?targetUser.email:id)+' -> '+sel.value);
      toast('Role updated.');
      state.cache.profiles=null; renderAdminUsers();
    };
  });
  root.querySelectorAll('[data-status]').forEach(function(chk){
    chk.onchange=async function(){
      var id = chk.getAttribute('data-status');
      var targetUser = state.cache.profiles.find(function(x){return x.id===id;});
      var newStatus = chk.checked?'active':'disabled';
      var {error} = await sb.from('profiles').update({status: newStatus}).eq('id', id);
      if(error){ toast(error.message,'error'); return; }
      logActivity('Changed status', (targetUser?targetUser.email:id)+' -> '+newStatus);
      state.cache.profiles=null; renderAdminUsers();
    };
  });
  root.querySelectorAll('[data-history]').forEach(function(b){
    b.onclick=function(){ historyModal(b.getAttribute('data-history')); };
  });
  bindPagination(function(key,page){ state.usersPage=page; renderAdminUsers(); });
  makeResizableTable('users-table','users');
}
function bindProfileEvents(){
  var btn = root.querySelector('#btn-save-profile');
  if(btn) btn.onclick=async function(){
    var payload = {
      full_name: root.querySelector('#pf-name').value||state.profile.full_name,
      company: root.querySelector('#pf-company').value||'',
      title: root.querySelector('#pf-title').value||'',
      phone_cc: root.querySelector('#pf-cc').value,
      phone: root.querySelector('#pf-phone').value||''
    };
    btn.textContent='Saving...'; btn.disabled=true;
    var {error} = await sb.from('profiles').update(payload).eq('id', state.profile.id);
    btn.textContent='Save changes'; btn.disabled=false;
    if(error){ toast(error.message,'error'); return; }
    Object.assign(state.profile, payload);
    logActivity('Updated profile', 'Self');
    toast('Changes saved.');
  };
}
function updateNavActiveStyles(){
  root.querySelectorAll('[data-nav]').forEach(function(b){
    var active = b.getAttribute('data-nav')===state.tab;
    b.classList.toggle('active', active);
  });
}
function bindShellEvents(){
  root.querySelectorAll('[data-nav]').forEach(function(b){ b.onclick=function(){ state.tab=b.getAttribute('data-nav'); state.sidebarOpen=false; updateNavActiveStyles(); renderTab(); }; });
  var lo = root.querySelector('#btn-logout'); if(lo) lo.onclick=async function(){ await sb.auth.signOut(); state.session=null; state.profile=null; state.cache={pipeline:null,investors:null,profiles:null,myHistory:null,audit:null,myAccessReq:undefined,accessRequests:null}; render(); };
  var hb = root.querySelector('#btn-hamburger'); if(hb) hb.onclick=function(){ state.sidebarOpen=true; root.querySelector('#gi-sidebar').classList.add('open'); root.querySelector('#gi-overlay').classList.add('show'); };
  var ov = root.querySelector('#gi-overlay'); if(ov) ov.onclick=function(){ state.sidebarOpen=false; root.querySelector('#gi-sidebar').classList.remove('open'); ov.classList.remove('show'); };
}

/* ---------------- ROUTER / RENDER ---------------- */
function renderTab(){
  if(state.profile.status==='disabled'){ setBody(disabledScreen(state.profile)); return; }
  var isAdmin = state.profile.role==='admin';
  if(state.tab==='dashboard' && isAdmin) renderDashboard();
  else if(state.tab==='pipeline') renderPipeline();
  else if(state.tab==='investors') renderInvestors();
  else if(state.tab==='admin-users' && isAdmin) renderAdminUsers();
  else if(state.tab==='access-requests' && isAdmin) renderAccessRequests();
  else if(state.tab==='audit-trail' && isAdmin) renderAuditTrail();
  else if(state.tab==='profile') renderProfile();
  else { state.tab = isAdmin? 'dashboard':'investors'; isAdmin? renderDashboard() : renderInvestors(); }
}

function render(){
  if(!sb){ root.innerHTML = notConfiguredScreen(); return; }
  if(state.authMode==='recovery'){ root.innerHTML = authScreen(); bindAuth(); return; }
  if(!state.session || !state.profile){ root.innerHTML = authScreen(); bindAuth(); return; }
  root.innerHTML = appShell(state.profile.status==='disabled'? disabledScreen(state.profile) : loadingBlock(3));
  bindShellEvents();
  renderTab();
}

async function afterAuth(){
  var {data:{session}} = await sb.auth.getSession();
  state.session = session;
  if(session){
    state.profile = await loadProfile(session.user.id);
    if(state.profile && state.profile.role==='admin'){ fetchAllAccessRequests().then(function(){ if(state.session) render(); }); }
  }
  render();
}

if(sb){
  sb.auth.onAuthStateChange(function(event, session){
    state.session = session;
    if(event==='PASSWORD_RECOVERY'){ state.authMode='recovery'; render(); return; }
    if(!session){ state.profile=null; render(); }
  });
  root.innerHTML = '<div style="padding:100px;text-align:center;color:var(--slate);">Loading...</div>';
  afterAuth();
} else {
  render();
}

})();
</script>
</body>
</html>
